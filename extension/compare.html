<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HouseSigma Comparison</title>
  <link rel="stylesheet" href="compare.css">
</head>
<body>
  <div id="toast"></div>
  <div class="page">
    <header class="hero">
      <h1>HouseSigma Comparison</h1>
      <p>
        <span id="generated">Loading…</span> ·
        <span id="prop-count">0</span> properties ·
        Chrome extension (no server)
      </p>
    </header>

    <section class="panel">
      <h2>Backup</h2>
      <div class="backup-row">
        <button type="button" class="btn btn-backup" id="export-backup-btn">Export backup JSON</button>
        <button type="button" class="btn btn-backup" id="import-backup-btn">Import backup JSON</button>
        <button type="button" class="btn btn-backup" id="import-merge-btn">Import (merge)</button>
        <input type="file" id="import-file" accept="application/json,.json" />
      </div>
      <p class="backup-hint">
        Export saves all properties to a file. Import replaces your list; Import (merge) adds without removing existing entries.
      </p>
    </section>

    <section class="panel">
      <div class="table-toolbar">
        <h2>Comparison table</h2>
        <span class="selected-meta" id="selected-count">0 selected</span>
        <button type="button" class="btn btn-delete-selected" id="delete-selected-btn" disabled>
          Delete selected
        </button>
        <button type="button" class="btn btn-export" id="export-selected-btn" disabled>
          Export selected CSV
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr id="compare-head"></tr>
          </thead>
          <tbody id="compare-body"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="lib/fields.js"></script>
  <script src="lib/normalize.js"></script>
  <script src="lib/commute.js"></script>
  <script src="lib/storage.js"></script>
  <script src="compare.js"></script>
</body>
</html>
