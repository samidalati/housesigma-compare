<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HouseSigma Compare</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      color: #1a2332;
    }
    .wrap {
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: #0d6e6e;
      line-height: 1.2;
    }
    .meta {
      margin: 0;
      font-size: 0.75rem;
      color: #5c6b7a;
      white-space: nowrap;
    }
    .hint {
      margin: 0;
      font-size: 0.8rem;
      color: #5c6b7a;
      line-height: 1.35;
    }
    .hint.saved { color: #0d6e6e; font-weight: 600; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .actions-divider {
      height: 1px;
      margin: 2px 0;
      background: #d8e2ec;
      border: none;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.2;
    }
    .btn-primary { background: #0d6e6e; color: #fff; }
    .btn-primary:hover { background: #0a5555; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary {
      background: #fff;
      color: #0d6e6e;
      border: 1px solid #0d6e6e;
    }
    .btn-secondary:hover { background: #e8f4f4; }
    .status {
      margin: 0;
      font-size: 0.8rem;
      line-height: 1.35;
    }
    .status:empty { display: none; }
    .status.err { color: #c0392b; }
    .status.ok { color: #0d6e6e; }
    .spinner {
      display: none;
      width: 1em;
      height: 1em;
      margin-right: 6px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    .btn.is-loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>HouseSigma Compare</h1>
      <p class="meta"><span id="count">0</span> saved</p>
    </div>
    <p class="hint" id="hint">Open a HouseSigma listing page.</p>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="property-btn" disabled>
        <span class="spinner" aria-hidden="true"></span>
        <span id="property-btn-label">Add current property</span>
      </button>
      <hr class="actions-divider" aria-hidden="true">
      <button type="button" class="btn btn-secondary" id="open-compare-btn">
        Open comparison table
      </button>
    </div>
    <p class="status" id="status" role="status"></p>
  </div>
  <script src="lib/fields.js"></script>
  <script src="lib/normalize.js"></script>
  <script src="lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
